services:
  db:
    image: postgres:15
    container_name: ticket-db
    restart: always
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tickets"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    container_name: ticket-backend
    command: ["sh", "/app/entrypoint.sh"]
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      POSTGRES_DB: tickets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  frontend:
    build: ./frontend
    container_name: ticket-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
